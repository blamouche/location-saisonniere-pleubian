name: Rafraîchir les marées

# Récupère quotidiennement les horaires de marée officiels du SHOM pour Port-Béni
# (port de référence le plus proche de Pleubian, US-032, PRD §14.5) — voir
# scripts/fetch-tides.mjs pour le détail de la source.
#
# GitHub Pages sert `docs/` tel quel depuis `main` (Settings → Pages → Deploy from a
# branch → /docs, voir astro.config.mjs `outDir`) : il n'y a pas de rebuild côté
# hébergeur. Ce workflow doit donc lui-même rebuilder le site après avoir rafraîchi
# la donnée, sans quoi `src/data/meteo-marees.generated.json` serait à jour mais le
# site publié resterait figé sur l'ancienne marée.

on:
  schedule:
    # 05h00 UTC, comme le rebuild quotidien visé au PRD §14.5.
    - cron: '0 5 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch-tides:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run fetch-tides

      - name: Rebuild (docs/ doit refléter la donnée fraîche)
        run: npm run build

      - name: Commit si la donnée ou le site publié a changé
        run: |
          if git diff --quiet -- src/data/meteo-marees.generated.json docs/; then
            echo "Aucun changement de marée à committer."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/meteo-marees.generated.json docs/
          git commit -m "marees: mise a jour quotidienne (SHOM, Port-Beni)"
          git push
