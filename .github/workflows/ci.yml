name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Type/diagnostics Astro (US-008).
      - run: npm run check

      # Sortie 100 % statique — voir docs/PRD.md §14.1 et docs/user-stories.md §0bis.
      - run: npm run build

      # Aucun lien interne cassé (US-008, US-047, US-050).
      - run: npm run check-links

  # TODO (US-008, Lot 0/3) : budgets Lighthouse CI bloquants (§14.4 du PRD) et
  # validation Schema.org des blocs JSON-LD — à ajouter une fois qu'un environnement
  # de preview est disponible (nécessite l'hébergement tranché, US-009).
