<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1250" viewBox="0 0 1000 1250" role="img" aria-label="Automne sur la Presqu’île — visuel provisoire">
  <defs>
    <linearGradient id="g" gradientTransform="rotate(84)">
      <stop offset="0%" stop-color="#a34a17"/>
      <stop offset="100%" stop-color="#c96a2e"/>
    </linearGradient>
    <pattern id="p" width="64" height="64" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="64" height="64" fill="transparent"/>
      <line x1="0" y1="0" x2="0" y2="64" stroke="#f7f1e6" stroke-opacity="0.06" stroke-width="32"/>
    </pattern>
  </defs>
  <rect width="1000" height="1250" fill="url(#g)"/>
  <rect width="1000" height="1250" fill="url(#p)"/>
  <rect x="24" y="24" width="420" height="44" rx="8" fill="#2b1d12" fill-opacity="0.55"/>
  <text x="40" y="54" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" fill="#f7f1e6" font-weight="600">PLACEHOLDER</text>
  <text x="50%" y="50%" text-anchor="middle" dominant-baseline="middle" font-family="ui-serif, Georgia, serif" font-size="50" fill="#f7f1e6" fill-opacity="0.95">Automne sur la Presqu’île</text>
  <text x="50%" y="1214" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" fill="#f7f1e6" fill-opacity="0.75">Visuel générique — remplacé au shooting réel</text>
</svg>
